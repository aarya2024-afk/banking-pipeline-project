name: Kubernetes CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Tests
      run: |
        pytest test_app.py

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        TAG=${{ github.run_number }}
        IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/banking-app
        docker build -t $IMAGE_NAME:$TAG .
        docker push $IMAGE_NAME:$TAG

    - name: Configure Kubernetes Manifest
      run: |
        TAG=${{ github.run_number }}
        SED_EXPR="s|DOCKERHUB_USERNAME/banking-app:TAG_PLACEHOLDER|${{ secrets.DOCKER_USERNAME }}/banking-app:$TAG|g"
        sed -i "$SED_EXPR" k8s/deployment.yaml

    - name: Validate Kubernetes Manifest Structure
      run: |
        cat k8s/deployment.yaml
